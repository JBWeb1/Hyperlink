<head>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
  /* Basic Reset */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0b0b12;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.65);
    --glass: rgba(255, 255, 255, 0.07);
    --glass-hover: rgba(255, 255, 255, 0.13);
    --border: rgba(255, 255, 255, 0.12);
    --accent-1: #ff416c;
    --accent-2: #7c5cff;
    --accent-3: #00c6ff;
  }

  body {
    font-family: 'Poppins', sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 56px 16px 32px;
    overflow-x: hidden;
    position: relative;
  }

  /* Blurred photo backdrop */
  .backdrop {
    position: fixed;
    inset: -40px;
    background: url("IMG-20250503-WA0033.jpg") center 70% / cover no-repeat;
    filter: blur(40px) saturate(1.4);
    opacity: 0.45;
    z-index: -2;
  }

  .backdrop::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(11, 11, 18, 0.35) 0%, var(--bg) 85%);
  }

  /* Soft glowing color blobs */
  .glow {
    position: fixed;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: -1;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }

  .glow.one { background: var(--accent-1); top: -80px; left: -100px; }
  .glow.two { background: var(--accent-3); bottom: -120px; right: -100px; animation-delay: -9s; }

  @keyframes drift {
    from { transform: translate(0, 0); }
    to   { transform: translate(60px, 40px); }
  }

  /* Page column */
  .container {
    width: 100%;
    max-width: 440px;
    text-align: center;
  }

  /* Profile Section */
  .avatar-ring {
    width: 128px;
    height: 128px;
    margin: 0 auto 18px;
    padding: 4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
    animation: spin 8s linear infinite;
    box-shadow: 0 10px 40px rgba(124, 92, 255, 0.35);
  }

  .avatar {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid var(--bg);
    object-fit: cover;
    object-position: center 80%;
    animation: spin 8s linear infinite reverse;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .profile h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .profile h1 i {
    font-size: 18px;
    color: var(--accent-3);
  }

  .tagline {
    margin-top: 6px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--border);
  }

  /* Social icon row */
  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 22px;
  }

  .socials a {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--text);
    font-size: 18px;
    background: var(--glass);
    border: 1px solid var(--border);
    text-decoration: none;
    transition: transform 0.25s ease, background 0.25s ease;
  }

  .socials a:hover,
  .socials a:focus-visible {
    transform: translateY(-3px);
    background: var(--glass-hover);
  }

  /* Links Section */
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 30px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px 10px 10px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-align: left;
    transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  }

  .link:hover,
  .link:focus-visible {
    transform: translateY(-3px);
    background: var(--glass-hover);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  }

  .link .icon {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    font-size: 20px;
    color: #fff;
  }

  .link .text {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .link .title {
    font-size: 15px;
    font-weight: 600;
  }

  .link .sub {
    font-size: 12px;
    color: var(--muted);
  }

  .link .arrow {
    font-size: 14px;
    color: var(--muted);
    transition: transform 0.25s ease;
  }

  .link:hover .arrow,
  .link:focus-visible .arrow {
    transform: translateX(4px);
    color: var(--text);
  }

  a:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  /* Brand colors for icon tiles */
  .instagram .icon { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); }
  .facebook  .icon { background: #1877f2; }
  .whatsapp  .icon { background: #25d366; }

  /* Featured shop card */
  .link.shop {
    position: relative;
    background: linear-gradient(135deg, rgba(255, 175, 189, 0.22), rgba(255, 195, 160, 0.22));
    border-color: rgba(255, 195, 160, 0.45);
  }

  .shop .icon { background: linear-gradient(45deg, #ffafbd, #ffc3a0); color: #111; }

  .shop .badge {
    position: absolute;
    top: -9px;
    right: 14px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #111;
    background: linear-gradient(45deg, #ffafbd, #ffc3a0);
    padding: 3px 10px;
    border-radius: 999px;
  }

  /* Footer */
  footer {
    margin-top: 36px;
    font-size: 12px;
    color: var(--muted);
  }

  /* Entrance animation */
  .reveal {
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.6s ease forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: none; }
  }

  /* Respect users who prefer less motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .reveal { opacity: 1; transform: none; }
  }
  </style>
</head>
