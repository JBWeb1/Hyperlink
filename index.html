<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethan Lee September | Links</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
  /* Basic Reset */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background: linear-gradient(270deg, #ff416c, #ff4b2b, #1e90ff, #00c6ff, #7c5cff);
    background-size: 1000% 1000%;
    animation: gradientMove 15s ease infinite;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating Particles */
  .background {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
  }

  .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,255,255,0.8);
    animation: float 10s linear infinite;
  }

  .particle:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; width: 8px; height: 8px; }
  .particle:nth-child(2) { top: 50%; left: 40%; animation-delay: 2s; width: 12px; height: 12px; }
  .particle:nth-child(3) { top: 70%; left: 80%; animation-delay: 4s; width: 9px; height: 9px; }
  .particle:nth-child(4) { top: 30%; left: 70%; animation-delay: 1s; width: 14px; height: 14px; }
  .particle:nth-child(5) { top: 80%; left: 25%; animation-delay: 3s; width: 11px; height: 11px; }

  @keyframes float {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    50% { transform: translateY(-60px) scale(1.2); opacity: 0.7; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* Container */
  .container {
    text-align: center;
    background: rgba(0, 0, 0, 0.45);
    padding: 40px 30px;
    border-radius: 20px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
    z-index: 5;
  }

  /* Profile Section */
  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #00bcd4;
    margin-bottom: 15px;
    transition: transform 0.3s ease;
  }

  .avatar:hover {
    transform: scale(1.08);
  }

  .profile h1 {
    font-size: 22px;
    margin-bottom: 5px;
  }

  .profile p {
    color: #ccc;
    font-size: 14px;
  }

  /* Links Section */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 25px;
  }

  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    padding: 12px;
    border-radius: 10px;
    color: white;
    font-weight: 500;
    transition: all 0.3s ease;
    font-size: 16px;
  }

  .link i {
    font-size: 18px;
  }

  .link:hover {
    transform: scale(1.07);
    box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
  }

  /* Specific Button Colors */
  .instagram { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); }
  .facebook  { background: #1877f2; }
  .whatsapp  { background: #25d366; }
  .shop      { background: linear-gradient(45deg, #ffafbd, #ffc3a0); color: #111; }

  .shop:hover {
    box-shadow: 0 4px 25px rgba(255, 200, 200, 0.5);
    transform: scale(1.08);
  }

  /* Footer */
  footer {
    margin-top: 25px;
    font-size: 13px;
    color: #bbb;
  }
  </style>
</head>
<body>
  <div class="background">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container">
    <div class="profile">
      <img src="IMG-20250503-WA0033.jpg" alt="Profile Picture" class="avatar">
      <h1>Ethan Lee September</h1>
      <p>Entrepreneur | Social Media Marketing</p>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/its_ethan_lee01/" target="_blank" class="link instagram">
        <i class="fab fa-instagram"></i> Instagram
      </a>

      <a href="https://www.facebook.com/ethanlee.september.7" target="_blank" class="link facebook">
        <i class="fab fa-facebook-f"></i> Facebook
      </a>

      <a href="https://wa.me/27812345678" target="_blank" class="link whatsapp">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </a>

      <a href="https://www.instagram.com/fragrance.vitality/" target="_blank" class="link shop">
        <i class="fas fa-store"></i> Insta Shop
      </a>
    </div>

    <footer>
      <p>By 2025 Joshua Bowers</p>
    </footer>
  </div>
</body>
</html>
